name: tests
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:  # ubuntu-latest no longer ships Python 3.9
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover tests -v
  template-has-only-examples:
    # The template repository must never hold real tasks or people.
    # setup.py removes this workflow from personal vaults.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bad=$(grep -L -E '^example:[[:space:]]*true[[:space:]]*$' Tasks/*.md People/*.md Archive/*/*.md 2>/dev/null || true)
          if [ -n "$bad" ]; then echo "Non-example files in the template:"; echo "$bad"; exit 1; fi
  release-tag-matches-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
